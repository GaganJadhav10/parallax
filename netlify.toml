# Parallax Netlify Production Deployment Configuration
# Frontend: React + TypeScript (Vite SPA)
# Backend: Go Parallax API (separate host)

[build]
  base = "web"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) fallback for React Router
# Ensures direct visits to /scans/new, /history, /sources, etc. load index.html correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for frontend distribution
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Cache static assets efficiently
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
