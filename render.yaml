# Render blueprint for the Parallax API server.
#
# Free plan caveats, both of which are Render's limits rather than Parallax's:
#   * No persistent disk, so the SQLite database is wiped on every restart,
#     redeploy and spin-down. Scan history does not survive.
#   * The service spins down after ~15 minutes without traffic; the next
#     request wakes it and can take up to a minute.
# Moving to a paid instance with a disk mounted at /data fixes both — add:
#   disk:
#     name: parallax-data
#     mountPath: /data
#     sizeGB: 1

services:
  - type: web
    name: parallax-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PARALLAX_HOST
        value: 0.0.0.0
      - key: PARALLAX_DB
        value: /data/parallax.db
      - key: PARALLAX_MAX_CONCURRENT_SCANS
        value: "3"
      # Set this to the frontend origin once Netlify has given you a URL.
      # Without it every browser request is blocked by CORS.
      - key: PARALLAX_CORS_ORIGINS
        sync: false
      # Optional provider credentials — leave unset to run the 8 keyless feeds.
      - key: VT_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
